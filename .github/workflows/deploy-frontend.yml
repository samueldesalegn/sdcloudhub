name: Deploy SD Cloud Hub Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy Angular App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sdcloudhub-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdcloudhub-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: aws s3 sync dist/sdcloudhub-frontend/browser s3://sdcloudhub-frontend-samuel --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E3AKDHU0DBZGOP --paths "/*"